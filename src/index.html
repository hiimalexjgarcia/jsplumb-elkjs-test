<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jsplumb-elkjs-test</title>
  </head>
  <body>
    <button id="add-node" class="btn btn-primary m-3" type="button">Add node</button>
    <button id="show-graph" class="btn btn-secondary m-3" type="button">Show graph</button>
    <div id="app"></div>
    <div
      id="graph-modal"
      class="modal fade"
      tabindex="-1"
      aria-labelledby="graph-modal-title"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h1 id="graph-modal-title" class="modal-title fs-5">Graph model</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <pre id="graph-dump" class="mb-0"></pre>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./js/main.ts"></script>
  </body>
</html>
