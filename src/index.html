<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jsplumb-elkjs-test</title>
  </head>
  <body>
    <main id="graph-editor">
      <div class="d-flex flex-wrap align-items-center gap-2 m-3 graph-toolbar">
        <button id="add-node" class="btn btn-primary" type="button">Add node</button>
        <button id="show-graph" class="btn btn-secondary" type="button">Show graph</button>
        <button id="connect-mode" class="btn btn-outline-primary" type="button" aria-pressed="false">
          Connect
        </button>
        <button id="edit-selected" class="btn btn-outline-secondary" type="button" disabled>
          Edit selected
        </button>
        <button id="delete-selected" class="btn btn-outline-danger" type="button" disabled>
          Delete selected
        </button>
        <div class="btn-group" role="group" aria-label="Graph zoom">
          <button id="zoom-out" class="btn btn-outline-secondary" type="button" aria-label="Zoom out">−</button>
          <button id="fit-graph" class="btn btn-outline-secondary" type="button">Fit</button>
          <button id="zoom-in" class="btn btn-outline-secondary" type="button" aria-label="Zoom in">+</button>
        </div>
        <span id="graph-action-status" class="small text-secondary" role="status" aria-live="polite"></span>
      </div>
      <div id="graph-viewport" class="graph-viewport" role="region" aria-label="Graph workspace">
        <div id="graph-surface" class="graph-surface">
          <div id="graph-canvas"></div>
        </div>
      </div>
      <div
        id="graph-modal"
        class="modal fade"
        tabindex="-1"
        aria-labelledby="graph-modal-title"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-scrollable modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h1 id="graph-modal-title" class="modal-title fs-5">Graph model</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <pre id="graph-dump" class="mb-0"></pre>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="./js/main.ts"></script>
  </body>
</html>
